name: SAP Ad Grants Automation
 
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Fix Node.js 20 deprecation warning
 
on:
  schedule:
    - cron: '0 13 * * *'    # Alert watcher 6am PST daily (posts only NEW critical issues)
    - cron: '0 14 * * 1'    # Monday digest 7am PST — the weekly all-client rollup
    - cron: '0 16 * * 1'    # Weekly reports Monday 9am PST
    - cron: '0 12 * * 1'    # AI visibility + SEO rankings Monday 5am PST (before reports)
 
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run manually'
        required: true
        default: 'alerts'
        type: choice
        options:
          - alerts
          - digest
          - reports
          - fetch_ga4
          - fetch_seo
          - fetch_ai
          - fetch_local
          - fetch_organic
          - fetch_authority
          - fetch_competitors
          - all
 
jobs:
 
  # ── ALERT WATCHER ─────────────────────────────────────────────────────
  alerts:
    name: Alert watcher
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'alerts' || github.event.inputs.job == 'all')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 13 * * *')
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Install dependencies
        run: pip install requests google-ads google-auth google-auth-httplib2 pyyaml
 
      - name: Write google-ads.yaml
        run: echo "$GOOGLE_ADS_YAML" > google-ads.yaml
        env:
          GOOGLE_ADS_YAML: ${{ secrets.GOOGLE_ADS_YAML }}
 
      - name: Fetch Google Ads data
        run: python fetch_google_ads.py
 
      - name: Load latest alert state
        run: |
          git fetch origin main
          git checkout origin/main -- .alert_state.json || echo "No prior state"

      - name: Run alert watcher
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
        run: python alert_watcher.py

      # Best-effort: losing a state write costs one duplicate alert, so it must
      # never fail the run. Replays the state onto latest main instead of
      # rebasing, because re-running an older run always conflicts otherwise.
      - name: Persist alert state
        continue-on-error: true
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "SAP Automation"
          git fetch origin main
          git reset --mixed origin/main
          git add .alert_state.json
          git diff --staged --quiet && echo "No state change" || (git commit -m "Update alert state" && git push origin HEAD:main)
 
  # ── MONDAY DIGEST ─────────────────────────────────────────────────────
  digest:
    name: Monday digest
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 14 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'digest' || github.event.inputs.job == 'all'))
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Install dependencies
        run: pip install requests google-ads google-auth google-auth-httplib2 pyyaml
 
      - name: Write google-ads.yaml
        run: echo "$GOOGLE_ADS_YAML" > google-ads.yaml
        env:
          GOOGLE_ADS_YAML: ${{ secrets.GOOGLE_ADS_YAML }}
 
      - name: Fetch Google Ads data
        run: python fetch_google_ads.py
 
      - name: Run Slack digest
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python slack_digest.py
 
  # ── WEEKLY REPORTS (Monday 9am PST) ───────────────────────────────────
  reports:
    name: Weekly client reports
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 16 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'reports' || github.event.inputs.job == 'all'))
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Install dependencies
        run: pip install requests google-ads google-auth google-auth-httplib2 pyyaml google-analytics-data
 
      - name: Write google-ads.yaml
        run: echo "$GOOGLE_ADS_YAML" > google-ads.yaml
        env:
          GOOGLE_ADS_YAML: ${{ secrets.GOOGLE_ADS_YAML }}
 
      - name: Fetch Google Ads data
        run: python fetch_google_ads.py
 
      - name: Fetch GA4 data
        env:
          GA_SERVICE_ACCOUNT: ${{ secrets.GA_SERVICE_ACCOUNT }}
        run: python fetch_ga4.py
 
      - name: Generate all client reports v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          LIVE_API_URL: ${{ vars.LIVE_API_URL }}
          REPORT_SIGNING_KEY: ${{ secrets.REPORT_SIGNING_KEY }}
        run: python generate_reports_v2.py
 
      - name: Validate reports
        run: python generate_reports_v2.py --validate-only
 
      - name: Commit reports to GitHub Pages
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "SAP Automation"
          git add reports/ ga4_cache.json || true
          git diff --staged --quiet && echo "No changes" || (git commit -m "Weekly reports $(date +'%B %d, %Y')" && git pull --rebase --autostash origin main && git push)
 
  # ── FETCH GA4 DATA ────────────────────────────────────────────────────
  fetch_ga4:
    name: Fetch GA4 data
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'fetch_ga4' || github.event.inputs.job == 'all'))
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Install dependencies
        run: pip install google-analytics-data google-auth
 
      - name: Fetch GA4 data
        env:
          GA_SERVICE_ACCOUNT: ${{ secrets.GA_SERVICE_ACCOUNT }}
        run: python fetch_ga4.py
 
      - name: Commit GA4 cache
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "SAP Automation"
          git add ga4_cache.json || true
          git diff --staged --quiet && echo "No changes" || (git commit -m "Update GA4 cache $(date +'%B %d, %Y')" && git pull --rebase --autostash origin main && git push)
 
  # ── FETCH SEO DATA ────────────────────────────────────────────────────
  fetch_seo:
    name: Fetch SEO data
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'fetch_seo' || github.event.inputs.job == 'all'))
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Install dependencies
        run: pip install requests google-auth pyyaml

      - name: Write google-ads.yaml
        run: echo "$GOOGLE_ADS_YAML" > google-ads.yaml
        env:
          GOOGLE_ADS_YAML: ${{ secrets.GOOGLE_ADS_YAML }}

      - name: Fetch SEO data
        env:
          PAGESPEED_API_KEY:   ${{ secrets.PAGESPEED_API_KEY }}
          GA_SERVICE_ACCOUNT:  ${{ secrets.GA_SERVICE_ACCOUNT }}
          DATAFORSEO_LOGIN:    ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python fetch_seo.py
 
      - name: Commit SEO cache
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "SAP Automation"
          git add seo_cache.json || true
          git diff --staged --quiet && echo "No changes" || (git commit -m "Update SEO cache" && git pull --rebase --autostash origin main && git push)

  # ── FETCH AI VISIBILITY (Monday 5am PST) ──────────────────────────────
  # Asks each client's tracked prompts in AI Overviews, AI Mode, ChatGPT,
  # Claude, Gemini and Perplexity. Engines without a secret are skipped.
  fetch_ai:
    name: Fetch AI visibility
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'fetch_ai' || github.event.inputs.job == 'all'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic

      - name: Fetch AI visibility
        env:
          DATAFORSEO_LOGIN:    ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY:  ${{ secrets.PERPLEXITY_API_KEY }}
          SLACK_WEBHOOK:       ${{ secrets.SLACK_WEBHOOK }}
        run: python fetch_ai_visibility.py

      - name: Commit AI visibility cache
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "SAP Automation"
          git add ai_visibility_cache.json || true
          git diff --staged --quiet && echo "No changes" || (git commit -m "Update AI visibility $(date +'%B %d, %Y')" && git pull --rebase --autostash origin main && git push)

  # ── FETCH LOCAL MAP RANKINGS (Monday 5am PST) ─────────────────────────
  # Google Maps grid + Business Profile for clients with "local_tracking".
  fetch_local:
    name: Fetch local map rankings
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'fetch_local' || github.event.inputs.job == 'all'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch local map rankings
        env:
          DATAFORSEO_LOGIN:    ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python fetch_local.py

      - name: Commit local cache
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "SAP Automation"
          git add local_cache.json || true
          git diff --staged --quiet && echo "No changes" || (git commit -m "Update local map rankings $(date +'%B %d, %Y')" && git pull --rebase --autostash origin main && git push)

  # ── FETCH ORGANIC SEARCH (SEMrush-style, monthly) ─────────────────────
  # Runs with the Monday fetches; fetch_organic.py skips clients fetched in
  # the last 25 days, so each client refreshes about once a month.
  fetch_organic:
    name: Fetch organic search
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'fetch_organic' || github.event.inputs.job == 'all'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch organic search
        env:
          DATAFORSEO_LOGIN:     ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD:  ${{ secrets.DATAFORSEO_PASSWORD }}
          DATAFORSEO_BACKLINKS: ${{ vars.DATAFORSEO_BACKLINKS }}
        run: python fetch_organic.py

      - name: Commit organic cache
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "SAP Automation"
          git add organic_cache.json || true
          git diff --staged --quiet && echo "No changes" || (git commit -m "Update organic search $(date +'%B %d, %Y')" && git pull --rebase --autostash origin main && git push)

  # ── FETCH AUTHORITY (backlinks, monthly) ──────────────────────────────
  # Only runs when the DATAFORSEO_BACKLINKS variable is 1 (needs the
  # DataForSEO Backlinks API subscription). Skips clients fetched < 25 days ago.
  fetch_authority:
    name: Fetch authority
    runs-on: ubuntu-latest
    if: |
      vars.DATAFORSEO_BACKLINKS == '1' && (
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'fetch_authority' || github.event.inputs.job == 'all')))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch authority
        env:
          DATAFORSEO_LOGIN:     ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD:  ${{ secrets.DATAFORSEO_PASSWORD }}
          DATAFORSEO_BACKLINKS: ${{ vars.DATAFORSEO_BACKLINKS }}
        run: python fetch_authority.py

      - name: Commit authority cache
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "SAP Automation"
          git add authority_cache.json || true
          git diff --staged --quiet && echo "No changes" || (git commit -m "Update authority $(date +'%B %d, %Y')" && git pull --rebase --autostash origin main && git push)

  # ── FETCH COMPETITOR WEBSITE CHANGES (weekly) ─────────────────────────
  # New pages and content edits on each client's tracked competitors.
  # Free apart from optional Claude notes on each change.
  fetch_competitors:
    name: Fetch competitor changes
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.job == 'fetch_competitors' || github.event.inputs.job == 'all'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic

      - name: Fetch competitor changes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch_competitors.py

      - name: Commit competitor cache
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "SAP Automation"
          git add competitor_cache.json || true
          git diff --staged --quiet && echo "No changes" || (git commit -m "Update competitor changes $(date +'%B %d, %Y')" && git pull --rebase --autostash origin main && git push)
