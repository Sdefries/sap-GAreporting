name = "sap-aeo"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
GITHUB_REPO     = "Sdefries/sap-GAreporting"
GITHUB_BRANCH   = "main"
ALLOWED_ORIGINS = "https://sdefries.github.io"
DAILY_LIMIT     = "10"

# Create once with:  npx wrangler kv namespace create LIMITS
# then paste the id it prints here.
[[kv_namespaces]]
binding = "LIMITS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
